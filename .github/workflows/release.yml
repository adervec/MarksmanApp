name: Release

# Cut a release by pushing a version tag (e.g. v0.1.0) or publishing a
# GitHub Release. The build always runs and is attached to the Release;
# PyPI publishing is gated on the `pypi` environment (see below).
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Attach artifacts to the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only when an actual Release was published (not on a bare tag push).
    if: github.event_name == 'release'
    permissions:
      contents: write # needed to upload release assets
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}" --clobber

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Publishing uses PyPI Trusted Publishing (OIDC) — no stored tokens.
    # One-time setup required, otherwise this job will (intentionally) fail:
    #   1. Create the project's trusted publisher on PyPI:
    #      https://docs.pypi.org/trusted-publishers/  (owner: adervec,
    #      repo: MarksmanApp, workflow: release.yml, environment: pypi)
    #   2. Create a GitHub Environment named "pypi" (Settings → Environments)
    #      and optionally add required reviewers for a manual approval gate.
    # If you don't want PyPI publishing, delete this job.
    environment:
      name: pypi
      url: https://pypi.org/p/marksman
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
