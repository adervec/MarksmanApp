[project]
name = "marksman"
version = "0.5.0"
description = "Marksmanship drills and progress tracking for any launcher -- airsoft, foam darts, or whatever you install a pack for: tiered drills, target-image analysis, charts, desktop GUI, phone web app and Google Drive sync. All standard library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adam Erik Eryavec" }]
keywords = ["marksmanship", "airsoft", "nerf", "target", "grouping", "drills", "cli", "gui", "web", "mobile", "google-drive", "image-analysis", "coach"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: Console",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Games/Entertainment",
]

# The ENTIRE app -- grouping maths, scoring, tracking, storage, the PNG-based
# image analysis, and the CLI -- uses only the Python standard library, so it
# runs with no installs.
dependencies = []

[project.optional-dependencies]
# Optional: Pillow lets the vision layer read JPEG (and other) formats too.
# It is used only if importable; PNG works without it.
vision-extra = ["pillow>=9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
marksman = "marksman.cli:main"

# Windowed entry point: on Windows this gets a pythonw launcher, so the desktop
# app opens without a console window behind it.
[project.gui-scripts]
marksman-gui = "marksman.gui:launch"

[project.urls]
Homepage = "https://github.com/adervec/MarksmanApp"
Repository = "https://github.com/adervec/MarksmanApp"
Issues = "https://github.com/adervec/MarksmanApp/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["marksman"]

# The bundled equipment packs are data files, so they need saying so or they
# won't make it into the wheel and the app would install with no drills.
[tool.setuptools.package-data]
marksman = ["packs/*.json"]
