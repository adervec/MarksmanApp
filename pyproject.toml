[project]
name = "marksman"
version = "0.1.0"
description = "Progress tracker for airsoft marksmanship: analyzes marked-up target images (shot groupings) and tracks progress overall, by tool category, and by specific tool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adam Erik Eryavec" }]
keywords = ["airsoft", "marksmanship", "target", "grouping", "cli", "image-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Games/Entertainment",
]

# The ENTIRE app -- grouping maths, scoring, tracking, storage, the PNG-based
# image analysis, and the CLI -- uses only the Python standard library, so it
# runs with no installs.
dependencies = []

[project.optional-dependencies]
# Optional: Pillow lets the vision layer read JPEG (and other) formats too.
# It is used only if importable; PNG works without it.
vision-extra = ["pillow>=9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
marksman = "marksman.cli:main"

[project.urls]
Homepage = "https://github.com/adervec/MarksmanApp"
Repository = "https://github.com/adervec/MarksmanApp"
Issues = "https://github.com/adervec/MarksmanApp/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["marksman"]
