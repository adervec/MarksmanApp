[project]
name = "marksman"
version = "0.1.0"
description = "Progress tracker for shooting sports: analyzes marked-up target images (shot groupings) and tracks progress overall, by weapon category, and by specific weapon."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adam Erik Eryavec" }]

# The ENTIRE app -- grouping maths, scoring, tracking, storage, the PNG-based
# image analysis, and the CLI -- uses only the Python standard library, so it
# runs with no installs.
dependencies = []

[project.optional-dependencies]
# Optional: Pillow lets the vision layer read JPEG (and other) formats too.
# It is used only if importable; PNG works without it.
vision-extra = ["pillow>=9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
marksman = "marksman.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["marksman"]
